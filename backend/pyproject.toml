[project]
name = "yuki"
version = "0.1.0"
authors = [
    { name = "nepgear", email = "471198414@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.162,<0.163",
    "fastapi-pagination>=0.16.2,<0.17",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.16,<3",
    "redis>=5,<8",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
yuki-api = "yuki.main:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
